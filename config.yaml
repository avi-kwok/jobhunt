     MongoDB, Confluent, GitHub, Figma, Notion, DoorDash, Coinbase, Plaid,
     Robinhood, Intuit, Capital One, JPMorgan Chase, Goldman Sachs,
     Morgan Stanley, BlackRock, Visa, Mastercard, PayPal, Jane Street, Citadel,
     Citadel Securities, Two Sigma, Hudson River Trading, Jump Trading,
     IMC Trading, Optiver, D. E. Shaw]
  2:   # STRONG PRIORITY
    [D2L, BenchSci, Jobber, Sierra Wireless, Manulife,
     Affirm, Brex, Ramp, Wealthsimple, CrowdStrike, Palo Alto Networks, Okta,
     Zscaler, Wiz, SentinelOne, Snyk, Rubrik, Splunk, HashiCorp, Elastic,
     Fastly, Akamai Technologies, Red Hat, Oracle, IBM, Cisco, AMD, Intel,
     Qualcomm, Arm, Broadcom, Autodesk, SAP, Dropbox, Twilio, Postman, Vercel,
     Cockroach Labs, PagerDuty, Sentry, Canva, Asana, Samsara, The Trade Desk,
