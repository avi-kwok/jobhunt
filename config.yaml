# config.yaml
# ---------------------------------------------------------------------------
# Scanner configuration. Internships/co-ops ONLY.
#
# Companies are listed by NAME. Run `jobhunt discover` to resolve each to its
# ATS type + board slug (writes companies.resolved.yaml). Slugs are NOT
# hand-filled here because guessing 350 of them would produce dead endpoints.
# ---------------------------------------------------------------------------

criteria:
  # Distilled from the full title list into token matching (substring, case-
  # insensitive). This is deliberately more robust than exact-title matching:
  # it also catches "Software Engineering Intern – Summer 2026", etc.

  # TITLE must contain at least one of these (it's an internship/co-op/student role):
  # "student"/"campus" added for Canadian bank & co-op wording (e.g. RBC's
  # "Fall Student Opportunities Technology"); role_terms + exclude_terms + the LLM
  # filter keep precision high.
  internship_terms: [intern, internship, "co-op", coop, "co op", student, campus]

  # TITLE must contain at least one of these (it's a SWE/dev/infra/security role):
  role_terms:
    - software engineer
    - software developer
    - software development
    - sde
    - swe
    - computer science
    - full stack
    - full-stack
    - fullstack
    - backend
    - back-end
    - back end
    - frontend
    - front-end
    - front end
    - platform engineer
    - infrastructure engineer
    - cloud engineer
    - cloud developer
    - devops
    - dev ops
    - site reliability
    - sre
    - systems engineer
    - systems software
    - application developer
    - application software
    - developer tools
    - developer productivity
    - developer experience
    - automation engineer
    - integration engineer
    - api engineer
    - api developer
    - data engineer
    - data engineering
    - database engineer
    - distributed systems
    - security engineer
    - security engineering
    - application security
    - appsec
    - devsecops
    - production engineer
    - release engineer
    - build engineer
    - technology analyst   # bank early-career dev-track title (e.g. TD/RBC)

  # TITLE containing any of these is rejected (keeps it internship-level SWE):
  exclude_terms:
    - senior
    - staff
    - principal
    - manager
    - director
    - " lead"          # leading space avoids matching e.g. "Leadership Program"
    - new grad
    - new graduate
    - phd
    - ph.d
    - mba
    - full-time        # tune: remove if it drops valid "full-time internship" posts

  # Cheap Haiku relevance check on survivors of the above (recommended: keeps
  # borderline titles honest and reads the description for term length, etc.).
  use_llm_filter: true

  # FRESHNESS. Only notify on postings whose own timestamp is within this many
  # minutes. 60 comfortably covers the scan cadence (every 15-30 min) so a job
  # posted between scans is still caught, even if a run is missed. Paired with
  # the seen-store (dedupe), so nothing is ever notified twice. Sources without a
  # reliable timestamp (Workday; Greenhouse reports edit-time) are always included
  # and rely on the seen-store's "new since last scan" guarantee. Set to null/0 to
  # disable and use the seen-store alone.
  freshness_minutes: 360

# ---------------------------------------------------------------------------
# SPEND + RATE SAFEGUARDS. These hard-cap paid API usage so the key can never be
# used uncontrolled. Every LLM call is gated by these limits and its real token
# cost is logged to a local, git-ignored .jobhunt_usage.db. When a cap is hit,
# the run stops instead of spending more (postings are picked up next run).
# Inspect with `jobhunt budget`; audit key protections with `jobhunt security-check`.
# ---------------------------------------------------------------------------
budget:
  daily_usd: 0.50          # hard ceiling per calendar day (UTC)
  monthly_usd: 5.00        # hard ceiling per calendar month (UTC)
  max_calls_per_run: 60    # no single scan can exceed this many API calls
  min_seconds_between_calls: 0.4   # throttle: no uncontrolled back-to-back calls
  max_consecutive_errors: 3        # circuit breaker: stop after repeated failures
  haiku_max_tokens: 256    # per-call output ceiling for the matcher
  sonnet_max_tokens: 4096  # per-call output ceiling for the tailor
  enabled: true            # set false only to disable the guard (not recommended)

# ---------------------------------------------------------------------------
# POLITENESS / REQUEST PACING. Spreads load on shared hosts and reduces any
# throttling risk. This paces requests — it does NOT disguise the tool; the
# User-Agent stays honest and descriptive.
# ---------------------------------------------------------------------------
politeness:
  enabled: true
  company_delay_min: 0.8       # random pause between company fetches (seconds)
  company_delay_max: 3.0
  startup_jitter_seconds: 60   # random delay at the start of each scheduled scan
  shuffle_within_tier: true    # vary company order per run (tiers still ordered)

# ---------------------------------------------------------------------------
# NIGHTLY QUIET WINDOW. Scheduled scans self-skip during these hours (the agents
# still fire, but the scan exits immediately — no fetches, no spend). Times are in
# quiet_tz (IANA name, DST-aware) so you can think in one timezone. `jobhunt scan
# --force` overrides; seeding is never blocked.
# ---------------------------------------------------------------------------
schedule:
  enabled: false                   # false = scan 24/7 (quiet hours OFF, 2026-07-10) — also
                                   # closes the overnight-miss gap (8h quiet > 6h freshness)
  quiet_start: "21:00"             # 9:00 PM  (ignored while enabled: false)
  quiet_end: "05:00"               # 5:00 AM  (ignored while enabled: false)
  quiet_tz: "America/Los_Angeles"  # Pacific (PST/PDT), DST-aware
  max_run_seconds: 0               # 0 = watchdog OFF (a legit full/priority scan can run ~15-20 min and must not be force-killed)

# Location ranking. Matches are sorted by tier (1 = highest priority). A match
# is still reported if it hits none — it just sorts last. Substring, lowercase.
location_tiers:
  tier_1_local:            # Vancouver / Toronto first
    [vancouver, toronto]
  tier_2_us_metros:        # major US cities & tech hubs
    [san francisco, "new york", nyc, seattle, "los angeles", boston, austin,
     chicago, "palo alto", "mountain view", "san jose", "santa clara", "menlo park",
     sunnyvale, redmond, "bellevue", denver, atlanta, "washington", "bay area",
     cupertino, "san diego", irvine, dallas, houston, raleigh, durham, pittsburgh,
     phoenix, tempe, portland, "salt lake city", boulder, minneapolis, philadelphia,
     nashville, miami, reston, "san antonio", detroit, "ann arbor"]
  tier_3_rest_of_canada:
    [canada, montreal, ottawa, calgary, waterloo, kitchener, edmonton, halifax,
     "quebec", winnipeg, victoria, "british columbia", ontario]
  tier_4_remote:
    [remote]

# ---------------------------------------------------------------------------
# COMPANY PRIORITY. Grouped lists (human-friendly to edit); the loader inverts
# these into a name -> priority dict for O(1) lookup. Tier 1 = highest. Any
# company in the watchlist NOT listed here defaults to priority 4 (still
# tracked, just sorted last). Names match the canonical watchlist below; three
# aliases were translated: TD Bank -> TD, Susquehanna International Group -> SIG,
# Ontario Teachers' Pension Plan -> OTPP.
# ---------------------------------------------------------------------------
