name: jobhunt scan

# Optional scheduled scanner. Local cron/launchd is the simpler default; this is
# here if you'd rather run it in CI. Runs every 15 minutes and on manual dispatch.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Read-only: the seen-store is personal data and is never committed back.
permissions:
  contents: read

concurrency:
  group: jobhunt-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: jobhunt scan

      # NOTE: the seen-store (jobhunt.db) is deliberately NOT persisted here.
      # It holds your job-search history, so committing it back would publish
      # that history to this repo on every run. Consequence: each CI run starts
      # with an empty seen-store and will re-notify on postings it has already
      # seen. Local cron/launchd (see deploy/) keeps the store on your own box
      # and is the recommended way to run this.
